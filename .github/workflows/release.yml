name: Automated Extension Release

on:
  push:
    branches: [ "main", "master" ] # Запускається при кожному звичайному пуші в головну гілку

jobs:
  release:
    name: Update Latest Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дозвіл на перезапис файлів у релізах

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Створюємо чистий ZIP-архів актуальної версії коду
      - name: Create Clean Extension ZIP
        run: |
          zip -r uafilter-extension.zip . -x "*.git*" ".github*"

      # Створюємо або перезаписуємо існуючий стабільний реліз
      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: uafilter-extension.zip
          name: UAFilter Latest Stable Build
          tag_name: latest # Тег завжди буде однаковим, щоб посилання не змінювалося
          make_latest: true
          prerelease: false
          body: |
            ## 🛡️ Актуальна збірка розширення UAFilter
            Цей архів оновлюється **автоматично** при кожному збереженні змін у коді репозиторію.

            ⏱️ _Останнє оновлення: \({{ github.event.head_commit.message }} (коміт \){{ github.sha }})_

            ### 📦 Інструкція зі встановлення:
            1. Завантажте прикріплений нижче архів `uafilter-extension.zip`.
            2. Розпакуйте архів у зручну папку на комп'ютері.
            3. Перейдіть в браузері в `chrome://extensions/`.
            4. Увімкніть **Режим розробника** (Developer mode) у правому верхньому кутку.
            5. Натисніть кнопку **Завантажити розпаковане розширення** (Load unpacked) та виберіть папку з файлами.
