name: Code Quality Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  linting:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node_version: '20'

      # 1. Перевірка HTML
      - name: Run HTMLHint
        run: npx htmlhint **/*.html --ignore google*.html

      # 2. Автономна перевірка CSS (використовує стандартний конфіг прямо під час білду)
      - name: Lint CSS
        run: |
          npm install -g stylelint stylelint-config-standard
          echo '{"extends": "stylelint-config-standard"}' > .stylelintrc.json
          npx stylelint "**/*.css" --allow-empty-input

      # 3. Автономна перевірка JavaScript (створює тимчасові базові правила)
      - name: Lint JavaScript
        run: |
          npm install -g eslint
          echo '{"env": {"browser": true, "webextensions": true, "es2021": true}, "extends": "eslint:recommended"}' > .eslintrc.json
          npx eslint "**/content.js" --no-error-on-unmatched-pattern
