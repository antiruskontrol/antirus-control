name: HTML Linter Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  htmlhint:
    name: Lint HTML Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run HTMLHint Validation
        uses: htmlhint/action-htmlhint@v2.2.0
        with:
          file_pattern: "index.html"
