name: Code Quality Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  linting:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Перевірка HTML (працює стабільно в будь-якому проєкті)
      - name: Run HTMLHint
        run: npx htmlhint **/*.html --ignore google*.html
